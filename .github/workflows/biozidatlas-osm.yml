name: Antifouling-Atlas - Häfen aus OpenStreetMap

# The sandbox cannot reach OpenStreetMap; a runner can. This asks Overpass for
# every named marina in Germany, writes biozidatlas/data/osm-haefen.json and
# commits it. A push made with GITHUB_TOKEN starts no other workflow, so the
# job asks for the site to be published afterwards.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 3 * *"   # monthly, on the 3rd at 04:17 UTC

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask Overpass for the marinas
        run: python3 biozidatlas/tools/osm_haefen.py
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add biozidatlas/data/osm-haefen.json
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Antifouling-Atlas: Häfen aus OpenStreetMap aktualisiert

          Geschrieben von biozidatlas/tools/osm_haefen.py aus einer
          Overpass-Abfrage (© OpenStreetMap-Mitwirkende, ODbL)."
          git push
          gh workflow run publish.yml --ref "${GITHUB_REF_NAME}"
