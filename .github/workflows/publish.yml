name: Quarto Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Falls deine .qmd R/Python ausführen, hier R bzw. Python einrichten.
      # - uses: r-lib/actions/setup-r@v2
      # - uses: actions/setup-python@v5

      - name: Render
        run: quarto render

      # Spracheingabe des Antifouling-Atlas: Modell und Laufzeit liegen auf dem
      # Zweig biozidatlas-modelle (Workflow biozidatlas-sprachmodell.yml).
      - name: Add speech model for biozidatlas
        run: |
          if git fetch -q --depth 1 origin biozidatlas-modelle; then
            mkdir -p _site/biozidatlas/modelle
            git archive FETCH_HEAD | tar -x -C _site/biozidatlas/modelle
            du -sh _site/biozidatlas/modelle
          else
            echo "Zweig biozidatlas-modelle fehlt noch, Spracheingabe ohne Modell"
          fi

      # Anleitungsvideo: Zweig biozidatlas-video (Workflow biozidatlas-video.yml).
      - name: Add tutorial video for biozidatlas
        run: |
          if git fetch -q --depth 1 origin biozidatlas-video; then
            mkdir -p _site/biozidatlas/video
            git archive FETCH_HEAD | tar -x -C _site/biozidatlas/video
            du -sh _site/biozidatlas/video
          else
            echo "Zweig biozidatlas-video fehlt noch"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
