name: Find teaching photographs

# The development sandbox cannot reach any host on the internet; a runner can.
# This asks Wikimedia Commons what pictures of each tree defect exist and under
# what licence, and prints the ones that may be shipped. It downloads nothing:
# a human picks from the report, and photo-fetch.sh brings those in.

on:
  workflow_dispatch:
    inputs:
      per_term:
        description: how many hits per search term
        default: '6'

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask Commons what there is, by name
        run: bash tools/photo-search.sh tools/photo-terms.txt "${{ inputs.per_term }}"
      - name: And by category, which is what people actually curate
        if: always()
        run: bash tools/photo-cats.sh tools/photo-cats.txt 2 8
      - name: And what the universities have put out openly
        if: always()
        run: bash tools/oer-search.sh tools/oer-terms.txt 12
      - name: And the one source that really has pictures of this
        if: always()
        run: bash tools/inat-search.sh tools/inat-terms.txt 8
