name: Antifouling-Atlas - Eingabe übernehmen

# The input form on eingabe.html opens an issue that carries the record as a
# JSON block. When an editor approves it - by adding the label "freigegeben"
# or by running this workflow with the issue number - the record is checked,
# an attached image is downloaded, and the entry is written to the data,
# committed and published. Only people with triage or write access can add
# labels or run workflows, so nothing goes in without review.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Nummer des Vorgangs mit der Eingabe
        required: true

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  uebernehmen:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'freigegeben'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the record and write it to the data
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
        run: python3 biozidatlas/tools/eingabe_uebernehmen.py
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add biozidatlas/data
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -F "$RUNNER_TEMP/eingabe-commit.txt"
          git pull --rebase --quiet
          git push
          gh workflow run publish.yml --ref "${GITHUB_REF_NAME}"
